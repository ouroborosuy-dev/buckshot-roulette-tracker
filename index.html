<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buckshot Tracker</title>
<style>
  :root { --bg:#121214; --card:#1c1c20; --bdr:#2e2e34; --live:#ef4444; --ld:#991b1b; --blk:#3b82f6; --bd:#1e40af; --txt:#f4f4f5; --mut:#a1a1aa; }
  * { box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; user-select:none; }
  body { background:var(--bg); color:var(--txt); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:12px; }
  .app { background:var(--card); border:1px solid var(--bdr); border-radius:12px; padding:16px; width:100%; max-width:390px; box-shadow:0 10px 30px rgba(0,0,0,.6); }
  h1 { font-size:13px; text-transform:uppercase; letter-spacing:2px; color:var(--mut); margin:0 0 12px; text-align:center; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .box { background:#141417; border:1px solid var(--bdr); border-radius:8px; padding:10px; text-align:center; }
  .box.live { border-top:3px solid var(--live); } .box.blank { border-top:3px solid var(--blk); }
  .lbl { font-size:11px; font-weight:700; letter-spacing:1px; }
  .live .lbl { color:var(--live); } .blank .lbl { color:var(--blk); }
  .cnt { font-size:34px; font-weight:800; margin:2px 0; }
  button { border:none; border-radius:6px; color:#fff; font-weight:700; cursor:pointer; }
  button:active { transform:scale(.96); }
  .btn-add { width:100%; padding:7px; font-size:15px; }
  .live .btn-add { background:var(--live); } .blank .btn-add { background:var(--blk); }
  .btn-sht { width:100%; margin-top:6px; padding:7px; font-size:11px; text-transform:uppercase; }
  .live .btn-sht { background:var(--ld); } .blank .btn-sht { background:var(--bd); }
  .panel { background:#141417; border:1px solid var(--bdr); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  .p-hdr { font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; text-align:center; }
  .p-txt { display:flex; justify-content:space-between; font-size:13px; font-weight:800; margin-bottom:6px; }
  .bar { height:9px; background:#27272a; border-radius:5px; overflow:hidden; display:flex; }
  .b-l { background:var(--live); transition:width .2s; } .b-b { background:var(--blk); transition:width .2s; }
  .c-hdr { font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; display:flex; justify-content:space-between; }
  .shells { display:flex; flex-wrap:wrap; gap:9px; min-height:64px; align-items:center; justify-content:center; }
  .empty { font-size:12px; color:#52525b; font-style:italic; }
  .shell { width:28px; height:54px; display:flex; flex-direction:column; cursor:pointer; position:relative; }
  .shell.next::after { content:'▲'; position:absolute; bottom:-13px; left:50%; transform:translateX(-50%); font-size:9px; color:#fbbf24; }
  .s-body { flex:1; background:#27272a; border:2px solid #3f3f46; border-bottom:none; border-radius:5px 5px 0 0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--mut); }
  .s-brass { height:12px; background:linear-gradient(90deg,#a16207,#eab308,#a16207); border-radius:0 0 3px 3px; border:1px solid #854d0e; }
  .shell.k-live .s-body { background:var(--live); border-color:#fca5a5; color:#fff; }
  .shell.k-blank .s-body { background:var(--blk); border-color:#93c5fd; color:#fff; }
  .shell.spent { opacity:.25; pointer-events:none; filter:grayscale(50%); }
  .shell.spent .s-body { text-decoration:line-through; }
  .btn-sec { background:#27272a; color:var(--txt); padding:9px; font-size:12px; }
  .h-list { max-height:85px; overflow-y:auto; font-size:11px; display:flex; flex-direction:column; gap:3px; }
  .h-item { display:flex; justify-content:space-between; padding:3px 6px; background:#1c1c20; border-radius:4px; border-left:2px solid #52525b; }
  .h-live { border-left-color:var(--live); } .h-blank { border-left-color:var(--blk); } .h-mark { border-left-color:#fbbf24; }
</style>
</head>
<body>
<div class="app">
  <h1>Buckshot Tracker</h1>
  <div class="grid">
    <div class="box live">
      <div class="lbl">REALES</div>
      <div class="cnt" id="lCnt">0</div>
      <button class="btn-add" onclick="add('live')">+1</button>
      <button class="btn-sht" onclick="shoot('live')">Disparada</button>
    </div>
    <div class="box blank">
      <div class="lbl">FOGUEO</div>
      <div class="cnt" id="bCnt">0</div>
      <button class="btn-add" onclick="add('blank')">+1</button>
      <button class="btn-sht" onclick="shoot('blank')">Disparada</button>
    </div>
  </div>
  <div class="panel">
    <div class="p-hdr" id="nxtLbl">Próximo disparo</div>
    <div class="p-txt"><span style="color:var(--live)" id="lPrb">Real: 0%</span><span style="color:var(--blk)" id="bPrb">Fogueo: 0%</span></div>
    <div class="bar"><div class="b-l" id="barL" style="width:0%"></div><div class="b-b" id="barB" style="width:0%"></div></div>
  </div>
  <div class="panel">
    <div class="c-hdr"><span>Recámara (Clic p/ marcar)</span><span id="totTxt">Restantes: 0</span></div>
    <div class="shells" id="chm"></div>
  </div>
  <div class="grid">
    <button class="btn-sec" id="undoBtn" onclick="undo()">↩ Deshacer (0)</button>
    <button class="btn-sec" style="background:#3f3f46" onclick="resetR()">Nueva Ronda</button>
  </div>
  <div class="panel" style="margin-bottom:0">
    <div class="c-hdr" style="margin-bottom:6px"><span>Historial</span><span id="hCnt">0 pasos</span></div>
    <div class="h-list" id="hList"><span class="empty">Sin acciones aún</span></div>
  </div>
</div>
<script>
  let st = { live:0, blank:0, order:[], logs:[] }, hist = [];
  const save = (txt, cls='') => { hist.push(JSON.parse(JSON.stringify(st))); st.logs.unshift({txt, cls}); };
  function add(t) {
    if (st.order.length >= 8) return;
    save(t==='live' ? '+1 Real cargada' : '+1 Fogueo cargada', t==='live'?'h-live':'h-blank');
    st[t]++; st.order.push({ status:'unknown', spent:false }); render();
  }
  function shoot(t) {
    const i = st.order.findIndex(s => !s.spent);
    if (st[t] <= 0 || i === -1) return;
    save(`Disparo #${i+1}: ${t==='live'?'REAL':'FOGUEO'}`, t==='live'?'h-live':'h-blank');
    st[t]--; st.order[i].spent = true; st.order[i].status = t; render();
  }
  function toggle(i) {
    const s = st.order[i]; if (!s || s.spent) return;
    let mL = 0, mB = 0;
    st.order.forEach((x, idx) => { if (!x.spent && idx !== i) { if (x.status==='live') mL++; if (x.status==='blank') mB++; } });
    const opts = ['unknown'];
    if (mL < st.live) opts.push('live');
    if (mB < st.blank) opts.push('blank');
    const nxt = opts[(opts.indexOf(s.status) + 1) % opts.length];
    save(`Bala #${i+1} -> ${nxt==='live'?'REAL':nxt==='blank'?'FOGUEO':'Incógnita'}`, 'h-mark');
    s.status = nxt; render();
  }
  function undo() { if (hist.length) { st = hist.pop(); render(); } }
  function resetR() { if (st.order.length) { save('Nueva ronda'); st.live=0; st.blank=0; st.order=[]; render(); } }
  function render() {
    document.getElementById('lCnt').textContent = st.live;
    document.getElementById('bCnt').textContent = st.blank;
    const rem = st.live + st.blank, nxt = st.order.findIndex(s => !s.spent);
    document.getElementById('totTxt').textContent = `Restantes: ${rem}`;
    let pL = 0, pB = 0;
    if (rem > 0 && nxt !== -1) {
      document.getElementById('nxtLbl').textContent = `Próximo disparo (Bala #${nxt+1})`;
      const cur = st.order[nxt];
      if (cur.status === 'live') { pL = 100; }
      else if (cur.status === 'blank') { pB = 100; }
      else {
        let kL = 0, kB = 0, unk = 0;
        st.order.forEach(x => { if (!x.spent) { if (x.status==='live') kL++; else if (x.status==='blank') kB++; else unk++; } });
        const uL = Math.max(0, st.live - kL), uB = Math.max(0, st.blank - kB);
        pL = (unk > 0 && (uL+uB) > 0) ? Math.round((uL/(uL+uB))*100) : Math.round((st.live/rem)*100);
        pB = 100 - pL;
      }
    } else { document.getElementById('nxtLbl').textContent = 'Sin balas en recámara'; }
    document.getElementById('lPrb').textContent = `Real: ${pL}%`;
    document.getElementById('bPrb').textContent = `Fogueo: ${pB}%`;
    document.getElementById('barL').style.width = pL+'%';
    document.getElementById('barB').style.width = pB+'%';
    const chm = document.getElementById('chm'); chm.innerHTML = '';
    if (!st.order.length) chm.innerHTML = '<span class="empty">Agrega balas con +1</span>';
    st.order.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = `shell ${s.status==='live'?'k-live':s.status==='blank'?'k-blank':''} ${s.spent?'spent':''} ${i===nxt?'next':''}`;
      if (!s.spent) d.onclick = () => toggle(i);
      d.innerHTML = `<div class="s-body">${i+1}</div><div class="s-brass"></div>`;
      chm.appendChild(d);
    });
    document.getElementById('undoBtn').textContent = `↩ Deshacer (${hist.length})`;
    document.getElementById('hCnt').textContent = `${hist.length} pasos`;
    const hl = document.getElementById('hList');
    hl.innerHTML = st.logs.length ? '' : '<span class="empty">Sin acciones aún</span>';
    st.logs.forEach((l, idx) => { hl.innerHTML += `<div class="h-item ${l.cls}"><span>${l.txt}</span><span style="color:#71717a">#${st.logs.length-idx}</span></div>`; });
  }
  render();
</script>
</body>
</html>
